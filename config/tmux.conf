# Enable mouse support
# set -g mouse on

# Prefix  
# for control space:  Uncheck the box next to "Select the previous input source" (which shows ^Space or ⌃Space).
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


# Fix colors and enable true color support
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# Start windows and panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Easy config reload with prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Intuitive split keys opening in current directory
bind \ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
 bind h select-pane -L
 bind j select-pane -D
 bind k select-pane -U
 bind l select-pane -R

# alternative option of tmux and nvim panes: 
# See: https://github.com/christoomey/vim-tmux-navigator

# Use Vi mode in copy mode
setw -g mode-keys vi

